<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Organiser dashboard | Eventify</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body>
<div id="site-header"></div>

<main>
  <section class="page-head page-head-compact">
    <div class="container page-head-row">
      <div>
        <h1 id="greeting">Hi</h1>
        <p>Create events, mark attendance and announce results.</p>
      </div>
      <a href="/organiser/events/new" class="btn btn-accent btn-lg"><i class="bi bi-plus-lg"></i> Create event</a>
    </div>
  </section>

  <section class="section section-tight">
    <div class="container">

      <div class="stat-cards">
        <div class="stat-card"><i class="bi bi-calendar2-event"></i><b id="statEvents">0</b><span>Events created</span></div>
        <div class="stat-card"><i class="bi bi-hourglass-split"></i><b id="statUpcoming">0</b><span>Not finished yet</span></div>
        <div class="stat-card"><i class="bi bi-people"></i><b id="statRegistrations">0</b><span>Total registrations</span></div>
        <div class="stat-card"><i class="bi bi-check2-circle"></i><b id="statPresent">0</b><span>Students marked present</span></div>
      </div>

      <div class="panel">
        <div class="panel-head"><h2>Your events</h2></div>
        <div id="eventsBox"></div>
      </div>

    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="/js/helpers.js"></script>
<script src="/js/api.js"></script>
<script src="/js/components.js"></script>
<script src="/js/pages/organiser-dashboard.js"></script>
<script src="/js/layout.js"></script>
</body>
</html>
