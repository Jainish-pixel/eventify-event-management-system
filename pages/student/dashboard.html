<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My events | Eventify</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body>
<div id="site-header"></div>

<main>
  <section class="page-head page-head-compact">
    <div class="container">
      <h1 id="greeting">Hi</h1>
      <p>Your tickets, attendance and certificates are all here.</p>
    </div>
  </section>

  <section class="section section-tight">
    <div class="container">

      <div class="stat-cards">
        <div class="stat-card"><i class="bi bi-ticket-perforated"></i><b id="statRegistered">0</b><span>Events registered</span></div>
        <div class="stat-card"><i class="bi bi-calendar-event"></i><b id="statUpcoming">0</b><span>Coming up</span></div>
        <div class="stat-card"><i class="bi bi-check2-circle"></i><b id="statAttended">0</b><span>Events attended</span></div>
        <div class="stat-card"><i class="bi bi-award"></i><b id="statCertificates">0</b><span>Certificates earned</span></div>
      </div>

      <!-- "your next event" banner is added here when there is one -->
      <div id="nextBox"></div>

      <div class="panel">
        <div class="panel-head">
          <h2>Upcoming events</h2>
          <a href="/events" class="btn btn-outline btn-sm">Find more events</a>
        </div>
        <div id="upcomingBox"></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>Past events</h2>
          <a href="/student/attendance" class="btn btn-outline btn-sm">See attendance</a>
        </div>
        <div id="pastBox"></div>
      </div>

    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="/js/helpers.js"></script>
<script src="/js/api.js"></script>
<script src="/js/components.js"></script>
<script src="/js/pages/student-dashboard.js"></script>
<script src="/js/layout.js"></script>
</body>
</html>
