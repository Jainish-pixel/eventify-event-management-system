<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | Eventify</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body>
<div id="site-header"></div>

<main class="auth-wrap">
  <aside class="auth-art">
    <div class="auth-art-inner">
      <h2>Join your campus events.</h2>
      <p>Students register for events and collect certificates. Organisers create events and manage everything in one place.</p>
      <div class="mini-ticket">
        <div class="mt-main">
          <strong>Certificate of participation</strong>
          <span>Earned by showing up</span>
        </div>
        <div class="mt-stub"><div class="barcode"></div></div>
      </div>
    </div>
  </aside>

  <section class="auth-panel">
    <div class="auth-card">
      <h1>Create your account</h1>
      <p class="sub">It takes less than a minute.</p>

      <div id="formMessage"></div>

      <form id="registerForm" novalidate>
        <div class="role-switch">
          <input type="radio" name="role" id="role-student" value="student" checked>
          <label for="role-student"><i class="bi bi-mortarboard"></i> Student</label>
          <input type="radio" name="role" id="role-organiser" value="organiser">
          <label for="role-organiser"><i class="bi bi-megaphone"></i> Organiser</label>
        </div>

        <div class="field">
          <label for="name">Full name</label>
          <div class="input-wrap">
            <i class="bi bi-person"></i>
            <input type="text" id="name" name="name" placeholder="As it should appear on certificates" required>
          </div>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <div class="input-wrap">
            <i class="bi bi-envelope"></i>
            <input type="email" id="email" name="email" placeholder="you@college.edu" required>
          </div>
        </div>

        <div class="field">
          <label for="college">Department and year, or club name <small>(optional)</small></label>
          <div class="input-wrap">
            <i class="bi bi-building"></i>
            <input type="text" id="college" name="college" placeholder="CSE, 3rd Year">
          </div>
        </div>

        <div class="form-grid">
          <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
              <i class="bi bi-lock"></i>
              <input type="password" id="password" name="password" placeholder="At least 6 characters" required>
            </div>
          </div>
          <div class="field">
            <label for="confirmPassword">Confirm password</label>
            <div class="input-wrap">
              <i class="bi bi-lock-fill"></i>
              <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Type it again" required>
            </div>
          </div>
        </div>

        <button class="btn btn-primary btn-block btn-lg" type="submit" id="submitBtn">Create account</button>
      </form>

      <p class="switch-link">Already have an account? <a href="/login" id="loginLink">Log in</a></p>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="/js/helpers.js"></script>
<script src="/js/api.js"></script>
<script src="/js/pages/register.js"></script>
<script src="/js/layout.js"></script>
</body>
</html>
