<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Certificate | Eventify</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Figtree:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/certificate.css">
</head>
<body class="cert-body">

  <!-- top bar (not printed) -->
  <div class="cert-toolbar no-print">
    <a class="cert-btn cert-btn-ghost" href="/" id="backLink">Back</a>
    <span class="cert-tip" id="tip"></span>
    <button class="cert-btn" type="button" id="printBtn">Download PDF</button>
  </div>

  <!-- the certificate is drawn here by js/pages/certificate.js -->
  <div class="cert-stage" id="stage"></div>

  <script src="/js/helpers.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/pages/certificate.js"></script>
</body>
</html>
